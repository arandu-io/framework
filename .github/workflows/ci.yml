name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The api diff step below reads the tags and checks the last release
          # out into a second worktree. The default checkout fetches one commit
          # and no tags at all, which does not fail that step -- it makes it
          # find no release, say so, and exit 0. A gate that compares nothing
          # and passes is not a gate, and this one had been green that way
          # since it was written, across 52 releases.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version
          # ("go 1.25"), and setup-go installs exactly that -- 1.25.0, whose
          # standard library carries vulnerabilities fixed in 1.25.11 and later.
          # govulncheck below is right to fail on it.
          #
          # "stable" is the version people actually run, which is what CI should
          # be testing against. The minimum in go.mod stays where it is.
          go-version: stable

      # A formatting difference is a failure, not a comment on a pull request.
      - name: gofmt
        # `gofmt -l .` skips nothing, and two things here are not valid Go on
        # purpose:
        #
        #   testdata/    fixtures the doctor has to reject, including a file
        #                that does not parse -- which is the test
        #   *.kyse.go    kyse sources; the compiler excludes them by build tag,
        #                and gofmt does not read build tags
        #
        # `go build`, `go vet` and `go test` skip both on their own.
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # The layout of the test tree, checked by the thing that can check it.
      # The first of its four rules is the one that costs the most to get wrong:
      # a file named DiskTest.go or disk_Test.go compiles as ordinary code and
      # none of its tests run, with no error and no warning.
      - name: test layout
        run: bash tests/test-layout-guard.sh

      # The race detector is what keeps the per-request Collector honest: it is
      # shared by every goroutine a request fans out to.
      #
      # The tags are not optional and are not a convenience. tests/Integration
      # and tests/E2E sit behind them so that a fresh clone can run `go test
      # ./...` without infrastructure -- and a directory whose files are all
      # excluded by a build constraint does not fail, it DISAPPEARS from
      # `./...`. Nothing is reported, nothing is skipped, the count simply drops
      # and the run is green. Removing these two words switches those suites off
      # and looks like a passing build.
      - name: test
        run: go test -race -tags 'integration e2e' ./...

      # Exit criterion 5 of phase 1: the core depends on the standard library and
      # golang.org/x/crypto, and nothing else. x/sys comes in transitively,
      # required by x/crypto itself.
      #
      # github.com/arandu-io/* is ours and is not third-party. This layer is
      # laravel/framework and hesape is src/Illuminate: the components live in
      # their own module because Go publishes a submodule without a subtree
      # splitter, not because they are somebody else's code. What the budget
      # exists to stop is a dependency the core did not write and cannot fix,
      # and that check is unchanged -- add a fifth line here and it fails.
      - name: dependency budget
        run: |
          unexpected=$(go list -m all | tail -n +2 |
            grep -v '^golang.org/x/' |
            grep -v '^github.com/arandu-io/' || true)
          if [ -n "$unexpected" ]; then
            echo "third-party dependency in the core:"
            echo "$unexpected"
            exit 1
          fi

      # The API surface, compared against the last release.
      #
      # doc 23 wrote this policy months before anything ran it: apidiff between
      # tags, the diff visible in review, an UPGRADE.md entry per break. None of
      # the three existed, and by the time somebody measured, more than a dozen
      # incompatible changes had shipped without a note.
      #
      # This does not forbid breaking. While the version starts with v0. it is
      # allowed to, and freezing a shape nobody has built on is worse. What it
      # forbids is breaking QUIETLY: an incompatible change with no entry in
      # UPGRADE.md fails here, in a diff a reviewer is looking at, rather than in
      # somebody's build three weeks later.
      #
      # The comparison is per MODULE and not package by package. A loop over the
      # packages of the working tree cannot see a package that was deleted: it is
      # not in `go list ./...` any more, so nothing ever asks about it. Removing
      # a whole package is the worst break there is, and it was the one that got
      # through -- httpx and httpx/middleware went in v0.26.0, and a per-package
      # loop run over that release names neither. Module mode reports a removed
      # package as the removal it is.
      #
      # -incompatible asks apidiff for that section instead of cutting it out of
      # the full report afterwards; a `sed` from the "Incompatible changes"
      # heading to the end also swallows the compatible section when both are
      # present, which does not change the verdict but does fill the log with
      # additions nobody needs to read.
      #
      # There is one module here, so one comparison. Nothing under this tree
      # carries a go.mod of its own.
      - name: api diff against the last release
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            echo "no release to compare against yet"
            exit 0
          fi
          echo "comparing the working tree against $latest"

          tmp=$(mktemp -d)
          old="$tmp/last-release"
          git worktree add -q --detach "$old" "$latest"
          # Reading the old surface has to happen in the old tree: apidiff
          # resolves a module path against the go.mod of the directory it runs
          # in, and from anywhere else it would read the module cache -- which
          # holds the published release, not the tag this checkout is at.
          #
          # No error is swallowed here. The loop this replaced ended both of its
          # apidiff calls with `|| continue` and `2>/dev/null`, so a package that
          # failed to load counted as a package with nothing to report.
          (cd "$old" && go run golang.org/x/exp/cmd/apidiff@latest -m -w "$tmp/api.out" github.com/arandu-io/framework)
          broke=$(go run golang.org/x/exp/cmd/apidiff@latest -m -incompatible "$tmp/api.out" github.com/arandu-io/framework | grep '^- ' || true)
          git worktree remove --force "$old"

          if [ -z "$broke" ]; then
            echo "no incompatible change since $latest"
            exit 0
          fi
          echo "$broke" | sed 's/^/    /'

          # Broken is allowed. Broken and unwritten is not.
          if git diff --quiet "$latest" -- UPGRADE.md; then
            echo
            echo "there are incompatible changes and UPGRADE.md was not touched since $latest."
            echo "Write what somebody has to change, and why. That file is the whole mechanism."
            exit 1
          fi
          echo
          echo "incompatible changes, and UPGRADE.md was updated. Read the entry in review."

      # Required by doc 24: a known vulnerability blocks the merge rather than
      # showing up in a report nobody reads.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
